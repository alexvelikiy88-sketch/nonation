<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10191c">
  <title>NONATION — Living City</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10191c; }
    #game-shell { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden; background: #10191c; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #10191c;
      border: 0; outline: 0; touch-action: none; }
    #loading, #error { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center;
      background: #10191c; color: #eff2ed; }
    #loading[hidden], #error[hidden] { display: none; }
    .loading-inner { width: min(320px, calc(100vw - 52px)); text-align: left; }
    .wordmark { letter-spacing: .14em; font-size: 18px; font-weight: 700; }
    .subtitle { margin-top: 11px; font-size: 12px; color: #a7b6b8; line-height: 1.55; }
    .track { height: 3px; margin-top: 29px; width: 100%; background: #344043; border-radius: 10px;
      overflow: hidden; }
    #progress { height: 100%; width: 0; background: #d8e0d9; transition: width .18s ease-out; }
    .hint { margin-top: 14px; color: #9ba9a8; font-size: 11px; }
    #error .loading-inner { line-height: 1.6; }
    #error-message { overflow-wrap: anywhere; color: #e2b8ad; }
    #retry { display: inline-block; margin-top: 14px; padding: 10px 18px; background: #27373b;
      color: #f4f4ef; border: 1px solid #687779; border-radius: 6px; font: inherit; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { #progress { transition: none; } }
  </style>
</head>
<body>
  <main id="game-shell">
    <canvas id="unity-canvas" tabindex="0" aria-label="NONATION interactive 3D city"></canvas>
    <div id="loading" role="status" aria-live="polite">
      <div class="loading-inner">
        <div class="wordmark">NONATION</div>
        <div class="subtitle">Living city · Loading the Unity WebGL world</div>
        <div class="track"><div id="progress"></div></div>
        <div class="hint" id="progress-text">Preparing the district</div>
      </div>
    </div>
    <div id="error" role="alert" hidden>
      <div class="loading-inner">
        <div class="wordmark">NONATION</div>
        <p>Failed to load the playable district.</p>
        <p id="error-message"></p>
        <button type="button" id="retry">Reload the game</button>
      </div>
    </div>
  </main>
  <script>
  (function () {
    "use strict";
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var error = document.getElementById("error");
    var errorText = document.getElementById("error-message");
    var progress = document.getElementById("progress");
    var progressText = document.getElementById("progress-text");
    document.getElementById("retry").addEventListener("click", function () {
      window.location.reload();
    });
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      devicePixelRatio: 1
    };
    function showError(message) {
      loading.hidden = true;
      error.hidden = false;
      errorText.textContent = String(message || "Unknown WebGL startup error.");
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (value) {
        var percent = Math.round(Math.max(0, Math.min(1, value)) * 100);
        progress.style.width = percent + "%";
        progressText.textContent = "Loading city " + percent + "%";
      }).then(function () {
        loading.hidden = true;
        canvas.focus({ preventScroll: true });
      }).catch(function (exception) {
        showError(exception);
      });
    };
    script.onerror = function () {
      showError("Unity loader could not be downloaded.");
    };
    document.body.appendChild(script);
  }());
  </script>
</body>
</html>
