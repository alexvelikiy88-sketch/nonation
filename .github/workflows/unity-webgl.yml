name: MIR Unity WebGL

on:
  push:
    branches: [main, 'agent/unity-webgl']
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'Tools/**'
      - 'Server/**'
      - '.github/workflows/unity-webgl.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_cloud_build:
        description: 'Read existing Unity Cloud build log ONLY (example: 3); no build is triggered'
        required: false
        type: string
        default: ''
      run_webgl_build:
        description: 'Explicitly authorize ONE licensed Unity WebGL build; leave false for log-only diagnostics'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Isolate PR/branch validation from main releases. A shared concurrency group
# otherwise replaces queued runs (including release runs) when agents push.
concurrency:
  group: mir-webgl-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-validation:
    runs-on: ubuntu-latest
    outputs:
      unity_license_present: ${{ steps.check_activation.outputs.available }}
      cloud_credentials_present: ${{ steps.check_activation.outputs.cloud_available }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate license-safe Unity project
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/MIR/Scripts/MirGame.cs
          test -f Assets/MIR/Editor/MirCloudBuild.cs
          test -f Packages/manifest.json
          test -f ProjectSettings/ProjectVersion.txt
          if find Assets -type f | grep -Ei '/(Girl_HighPoly|Floral_Look|Casual_Confidence|maid_skinned|dressfor|gign_paranoia|Honda_Civic|Freya)' ; then
            echo 'ERROR: third-party models require redistribution rights'
            exit 1
          fi
          python3 -m json.tool Packages/manifest.json > /dev/null
          echo 'Unity project and public asset checks passed'
      - name: C# source, build scene and manifest preflight
        run: python3 Tools/unity_source_preflight.py
      - name: Test Unity Cloud artifact extraction without credentials
        run: python3 -m unittest discover -s Tools/tests -p 'test_*.py' -v
      - name: Install .NET 8 for shared gameplay tests and server
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test shared city economy and simulation
        run: dotnet run --project Server/Nonation.Tests/Nonation.Tests.csproj --configuration Release
      - name: Compile authoritative server
        run: dotnet build Server/Nonation.Server/Nonation.Server.csproj --configuration Release --nologo
      - name: Smoke-test running backend HTTP and snapshot persistence
        shell: bash
        run: |
          set -euo pipefail
          export NONATION_LISTEN_URL=http://127.0.0.1:5180
          export NONATION_WORLD_FILE="${RUNNER_TEMP}/nonation-smoke-world.json"
          export NONATION_CORS_ORIGINS=https://alexvelikiy88-sketch.github.io
          dotnet Server/Nonation.Server/bin/Release/net8.0/Nonation.Server.dll &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 Tools/smoke_server.py
      - name: Cache verified CC0 humanoid animation packs
        uses: actions/cache@v4
        with:
          path: Assets/MIR/Art/Quaternius/*.fbx
          key: mir-quaternius-cc0-${{ hashFiles('Tools/fetch_quaternius.py') }}
      - name: Verify Quaternius CC0 archives and SHA-256 before any Unity build
        run: python3 Tools/fetch_quaternius.py
      - name: Check whether GameCI activation is configured
        id: check_activation
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SA_KEY_ID: ${{ secrets.UNITY_SA_KEY_ID }}
          UNITY_SA_SECRET_KEY: ${{ secrets.UNITY_SA_SECRET_KEY }}
        run: |
          if [ -n "$UNITY_SA_KEY_ID" ] && [ -n "$UNITY_SA_SECRET_KEY" ]; then
            echo "cloud_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity Cloud integration awaits two service-account secrets (UNITY_SA_KEY_ID and UNITY_SA_SECRET_KEY)."
          fi
          if { [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; } && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GameCI Unity license is not configured. Source checks passed; real build is performed via Unity Cloud Build Automation."
          fi

  webgl:
    needs: source-validation
    # Avoid expensive Unity compiles for every PR/push to agent branches.
    # Manual log-only diagnostics must never start another build.
    if: needs.source-validation.outputs.unity_license_present == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_webgl_build == true))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity activation
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo '::error title=Unity not activated::Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) in Settings > Secrets and variables > Actions. See https://game.ci/docs/github/activation/'
            exit 1
          fi
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo '::error title=Unity credentials missing::Add UNITY_EMAIL and UNITY_PASSWORD as GitHub Actions secrets; never commit them.'
            exit 1
          fi
      - name: Fetch verified CC0 Quaternius clips
        run: python3 Tools/fetch_quaternius.py
      - uses: actions/cache@v4
        with:
          path: Library
          key: unity-Linux-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-Linux-WebGL-
      - name: Build Unity 6 WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.0.58f2
          targetPlatform: WebGL
          buildMethod: MIR.Editor.MirCloudBuild.Build
      - name: Verify playable WebGL files
        shell: bash
        run: |
          set -euo pipefail
          test -s build/WebGL/index.html
          test -d build/WebGL/Build
          python3 Tools/unity_cloud_ci.py --verify-dir build/WebGL
          echo 'WebGL artifact layout valid; browser runtime not yet verified'
      - name: Upload downloadable WebGL ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nonation-unity-webgl
          path: build/WebGL/
          if-no-files-found: error
      - name: Upload WebGL for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL/

  cloud-diagnostics:
    name: Read existing Unity Cloud build failure log (no new build)
    needs: source-validation
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_cloud_build != '' && needs.source-validation.outputs.cloud_credentials_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Cloud build without retriggering Unity
        shell: bash
        env:
          UNITY_SA_KEY_ID: ${{ secrets.UNITY_SA_KEY_ID }}
          UNITY_SA_SECRET_KEY: ${{ secrets.UNITY_SA_SECRET_KEY }}
          BUILD_NUMBER_TO_INSPECT: ${{ inputs.inspect_cloud_build }}
        run: python3 Tools/unity_cloud_ci.py --diagnose-build "$BUILD_NUMBER_TO_INSPECT"

  cloud-webgl:
    name: Unity Cloud WebGL (optional service account)
    needs: source-validation
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.run_webgl_build == true)) && needs.source-validation.outputs.cloud_credentials_present == 'true' && needs.source-validation.outputs.unity_license_present != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      webgl_ready: ${{ steps.cloud.outputs.webgl_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify WebGL through Unity Cloud API v2
        id: cloud
        env:
          UNITY_SA_KEY_ID: ${{ secrets.UNITY_SA_KEY_ID }}
          UNITY_SA_SECRET_KEY: ${{ secrets.UNITY_SA_SECRET_KEY }}
        run: python3 Tools/unity_cloud_ci.py
      - name: Upload downloadable Unity Cloud WebGL
        if: steps.cloud.outputs.webgl_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nonation-unity-cloud-webgl
          path: build/WebGL/
          if-no-files-found: error
      - name: Upload verified Unity Cloud WebGL for GitHub Pages
        if: steps.cloud.outputs.webgl_ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL/

  deploy:
    name: Publish Unity WebGL to GitHub Pages
    needs: [webgl, cloud-webgl]
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.webgl.result == 'success' || (needs.cloud-webgl.result == 'success' && needs.cloud-webgl.outputs.webgl_ready == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Download the released WebGL build for HTTPS verification
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.webgl.result == 'success' && 'nonation-unity-webgl' || 'nonation-unity-cloud-webgl' }}
          path: build/WebGL
      - name: Verify all deployed Unity files over HTTPS
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 Tools/unity_cloud_ci.py --verify-hosted build/WebGL "$DEPLOYMENT_URL"; then
              echo "HTTPS WebGL static-asset proof for source ${GITHUB_SHA}; Unity browser runtime still unverified." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::GitHub Pages did not serve all Unity files after six bounded checks."
              exit 1
            fi
            sleep 10
          done

  browser-smoke:
    name: Real browser Unity WebGL startup / input / save proof
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nonation-playwright" --no-save playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/nonation-playwright-browsers" "$RUNNER_TEMP/nonation-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check scene, hero movement and save/load in Chromium
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nonation-playwright-browsers
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require(process.env.RUNNER_TEMP + '/nonation-playwright/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--enable-webgl', '--ignore-gpu-blocklist',
                     '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader']
            });
            const page = await browser.newPage({viewport: {width: 1280, height: 720}});
            let messages = [];
            const errors = [];
            page.on('console', msg => {
              const line = msg.text();
              messages.push(line);
              if (line.includes('NONATION_') || msg.type() === 'error')
                console.log('WEBGL CONSOLE [' + msg.type() + '] ' + line.slice(0, 500));
              if (msg.type() === 'error') errors.push(line);
            });
            page.on('pageerror', err => {
              errors.push(err.message);
              console.error('WEBGL PAGE ERROR ' + err.message);
            });
            async function proof(marker, ms = 180000) {
              const start = Date.now();
              while (Date.now() - start < ms) {
                const hit = messages.find(line => line.includes(marker));
                if (hit) return hit;
                await page.waitForTimeout(1000);
              }
              throw new Error('Missing runtime proof: ' + marker +
                              '\nLast browser logs: ' + messages.slice(-15).join('\n'));
            }
            try {
              await page.goto(process.env.DEPLOYMENT_URL, {
                waitUntil: 'domcontentloaded', timeout: 60000
              });
              const ready = await proof('NONATION_RUNTIME_READY');
              if (!ready.includes('scene=MIR_PlayableDistrict') ||
                  !ready.includes('player=player-001') ||
                  !/npcs=(39|[4-9][0-9]|[1-9][0-9]{2,})\b/.test(ready))
                throw new Error('Unity scene or residents did not initialize: ' + ready);
              const canvas = page.locator('canvas').first();
              await canvas.waitFor({state: 'visible', timeout: 10000});
              const bounds = await canvas.boundingBox();
              if (!bounds || bounds.width < 200 || bounds.height < 200)
                throw new Error('Unity WebGL canvas is missing or too small');
              await canvas.click({position: {x: Math.floor(bounds.width * .75),
                                             y: Math.floor(bounds.height * .6)}});
              await page.keyboard.down('w');
              await page.waitForTimeout(1800);
              await page.keyboard.up('w');
              await proof('NONATION_PLAYER_MOVED', 10000);
              await proof('NONATION_SAVE_WRITTEN', 45000);
              messages = [];
              await page.reload({waitUntil: 'domcontentloaded', timeout: 60000});
              await proof('NONATION_SAVE_RESTORED');
              await proof('NONATION_RUNTIME_READY', 20000);
              if (errors.some(e => /RuntimeError|abort\(|out of memory|WebGL context lost/i.test(e)))
                throw new Error('Critical browser errors: ' + errors.join('; ').slice(0, 2000));
              console.log('PASS: actual Unity WebGL scene, player movement, save and restore in Chromium.');
            } catch (error) {
              try { await page.screenshot({path: 'nonation-browser-smoke.png', fullPage: true}); }
              catch (screenshotError) { console.error('Screenshot error:', screenshotError.message); }
              throw error;
            } finally {
              await browser.close();
            }
          })().catch(error => {console.error(error); process.exit(1);});
          NODE
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nonation-browser-failure
          path: nonation-browser-smoke.png
          if-no-files-found: ignore
