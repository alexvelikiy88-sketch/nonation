name: Rocketbox textures one-shot preparation

# Temporary workflow on graphics branch only. Remove after verified assets land.
on:
  push:
    branches: [agent/graphics-ui]
    paths:
      - '.github/workflows/rocketbox-textures-one-shot.yml'

permissions:
  contents: write

jobs:
  prepare-textures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphics-ui
          persist-credentials: true
      - name: Validate source and existing synthetic unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Assets/MIR/Art/Rocketbox -p 'test_*.py' -v
          python3 Assets/MIR/Art/Rocketbox/fetch_textures.py --dry-run
      - name: Fetch, hash-check, and prepare six MIT Rocketbox TGA textures
        shell: bash
        run: |
          set -euo pipefail
          python3 Assets/MIR/Art/Rocketbox/fetch_textures.py --max-edge 1024
      - name: Verify six staged results before committing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib,sys
          sys.path.insert(0,"Assets/MIR/Art/Rocketbox")
          from fetch_textures import TEXTURES, SOURCE_COMMIT, parse_tga_header
          root=pathlib.Path("Assets/MIR/Art/Rocketbox/Textures")
          manifest=json.loads((root/"textures_manifest.json").read_text())
          assert manifest["upstream_commit"]==SOURCE_COMMIT
          assert set(manifest["textures"])==set(TEXTURES)
          for name,sha in TEXTURES.items():
              f=root/name;raw=f.read_bytes()
              d=manifest["textures"][name]
              assert d["source_blob_sha1"]==sha
              assert hashlib.sha256(raw).hexdigest()==d["sha256"]
              w,h,_,_=parse_tga_header(raw)
              assert (w,h)==(d["width"],d["height"]) and max(w,h)<=1024
              print(name,w,h,len(raw),d["sha256"])
          assert (root.parent/"LICENSE.md").is_file()
          print("PASS: verified six textures, MIT notice, SHA-256 output manifest")
          PY
      - name: Commit verified WebGL-size source textures to graphics branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NONATION graphics asset CI"
          git config user.email "nonation-graphics-ci@users.noreply.github.com"
          git add Assets/MIR/Art/Rocketbox/Textures/
          git diff --cached --quiet && { echo "Already committed"; exit 0; }
          git commit -m "assets(graphics): add verified MIT Rocketbox pilot textures at 1024"
          git push origin HEAD:agent/graphics-ui
      - uses: actions/upload-artifact@v4
        with:
          name: rocketbox-verified-1024
          path: Assets/MIR/Art/Rocketbox/Textures/
          if-no-files-found: error
          retention-days: 7
