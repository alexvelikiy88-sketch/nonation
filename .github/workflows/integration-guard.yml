name: NONATION Integration Guard

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: integration-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ownership-integrity:
    name: Ownership and change integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted base (do not execute PR-provided guard)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head for a read-only diff
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - name: Test the base-version integration guard
        run: python3 -m unittest discover -s Tools/tests -p 'test_pr_integration_guard.py' -v
      - name: Enforce ownership and review dangerous changes
        run: python3 Tools/pr_integration_guard.py
