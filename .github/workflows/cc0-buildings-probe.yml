name: NONATION CC0 Textured Buildings Probe

# One-shot source-file inspection, separate from paid Unity Cloud builds.
on:
  push:
    branches: ['manager/cc0-textured-buildings-probe-20261027']
    paths:
      - '.github/workflows/cc0-buildings-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 2021 Quaternius CC0 buildings archive from OpenGameArt
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://opengameart.org/sites/default/files/ultimate_textured_building_pack_by_quaternius.zip"
          echo "CC0_SOURCE_PAGE=https://opengameart.org/content/lowpoly-buildings-pack"
          echo "CC0_ARCHIVE_URL=${SOURCE}"
          curl --location --fail --retry 3 --retry-delay 4 --connect-timeout 20 --max-time 140 \
            --user-agent 'Mozilla/5.0 NONATION-asset-license-audit' \
            --output /tmp/quaternius-2019.zip "${SOURCE}"
          test "$(stat -c%s /tmp/quaternius-2019.zip)" -gt 1000000
          test "$(stat -c%s /tmp/quaternius-2019.zip)" -lt 100000000
          echo "ASSET_ZIP_SHA256=$(sha256sum /tmp/quaternius-2019.zip | cut -d ' ' -f 1)"
          echo "ASSET_ZIP_BYTES=$(stat -c%s /tmp/quaternius-2019.zip)"
          python3 - <<'PY'
          import zipfile
          from collections import Counter
          path = "/tmp/quaternius-2019.zip"
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError("Bad CRC in " + bad)
              files = [i for i in z.infolist() if not i.is_dir()]
              print("ASSET_ZIP_ENTRIES", len(files), "UNCOMPRESSED_BYTES", sum(i.file_size for i in files))
              print("ASSET_EXTENSIONS", dict(Counter(i.filename.rsplit(".", 1)[-1].lower() for i in files)))
              for i in files:
                  if i.filename.lower().endswith((".fbx",".obj",".png",".jpg",".jpeg",".mtl",".txt")):
                      print("ASSET_CONTENT", i.file_size, i.filename[:220])
          PY

      - name: Inspect selected prebuilt shop/cafe/civic/house FBX, materials and dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          import hashlib
          import struct
          import math
          names=["2Story_Wide_2Doors","2Story_Balcony","3Story_Small",
                 "3Story_Balcony","2Story_Sign","2Story_Columns"]
          root="Ultimate Textured Building Pack - Dec 2019/"
          with ZipFile("/tmp/quaternius-2019.zip") as z:
              for name in names:
                  paths=[
                     root+"Textured Models/Finished Textured Buildings/FBX/"+name+".fbx",
                     root+"Textured Models/Finished Textured Buildings/OBJ/"+name+".obj",
                     root+"Textured Models/Finished Textured Buildings/OBJ/"+name+".mtl",
                  ]
                  for p in paths:
                      raw=z.read(p)
                      print("SELECTED_FILE",name,len(raw),hashlib.sha256(raw).hexdigest(),p)
                      if p.endswith(".mtl"):
                          print("MATERIAL_MTL",name,raw.decode("utf-8",errors="replace")[:250])
                      if p.endswith(".obj"):
                          mins=[1e6]*3
                          maxs=[-1e6]*3
                          count=0
                          for line in raw.splitlines():
                              if line.startswith(b"v "):
                                  _,x,y,zv=line.split()[:4]
                                  xyz=[float(x),float(y),float(zv)]
                                  count+=1
                                  for i,v in enumerate(xyz):
                                      mins[i]=min(mins[i],v)
                                      maxs[i]=max(maxs[i],v)
                          print("ASSET_BOUNDS",name,"vertices",count,"min",mins,"max",maxs,
                              "extents",[round(maxs[i]-mins[i],4) for i in range(3)])
              for tex in ["Texture_Light.png","Texture_Red.png","Texture_Grey.png",
                          "Texture_Blue.png","Texture_Light2.png","Texture_Signs.png"]:
                  p=root+"Textured Models/Textures/"+tex
                  raw=z.read(p)
                  print("ASSET_TEXTURE",tex,len(raw),hashlib.sha256(raw).hexdigest(),
                        "pixel_size",struct.unpack(">II",raw[16:24]))
          PY
